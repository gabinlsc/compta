name: Vérifications

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  statique:
    name: Données, build, liens, référencement, poids
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run test:unit
      - name: Script de déploiement (syntaxe)
        run: bash -n deploy.sh
      - name: Le site généré est à jour
        run: |
          node tools/build.mjs
          git diff --exit-code -- . ':!package-lock.json' || { echo '::error::Lancer « npm run build » et commiter le résultat.'; exit 1; }
          test -z "$(git status --porcelain --untracked-files=all public)" || { echo '::error::Fichiers générés non commités dans public/.'; exit 1; }
      - run: node tools/check-links.mjs
      - run: node tools/check-seo.mjs
      - run: node tools/check-budget.mjs

  navigateur:
    name: Parcours, CSP, accessibilité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node tests/e2e.mjs
      - run: node tests/outil-facture.mjs
      - run: node tests/outil-simulateur.mjs
      - run: node tests/outil-calendrier.mjs
      - run: node tests/outil-tjm.mjs
      - run: node tests/csp.mjs
      - run: node tests/a11y.mjs
