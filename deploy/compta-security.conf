# En-têtes de sécurité et de cache de Compta by glsc.
# À inclure UNE FOIS dans le bloc « server » du site (voir docs/deploiement.md) :
#
#     include snippets/compta-security.conf;
#
# puis : nginx -t && systemctl reload nginx
# Aucune page n'appelle de service tiers : polices, styles, scripts et images sont hébergés sur le site.

# Pages HTML : toujours revalidées, pour qu'une mise à jour soit vue tout de suite.
expires -1;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

gzip on;
gzip_types text/css text/javascript application/json image/svg+xml application/xml text/calendar;

# Cache : polices et images ne changent pas ; CSS et JS portent une empreinte (?v=…) dans leur lien, 5 minutes de cache au plus.
location ~* \.(woff2|webp|png|svg|ico)$ { expires off; add_header Cache-Control "public, max-age=2592000" always; add_header X-Content-Type-Options "nosniff" always; }
location ~* \.(css|js|json)$ { expires off; add_header Cache-Control "public, max-age=300, must-revalidate" always; add_header X-Content-Type-Options "nosniff" always; }
# Calendriers .ics pré-générés (abonnement depuis un agenda) : type MIME dédié, un jour de cache.
location ~* \.ics$ { default_type text/calendar; expires off; add_header Cache-Control "public, max-age=86400" always; add_header X-Content-Type-Options "nosniff" always; }
